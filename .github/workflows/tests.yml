# GitHub Actions Workflow para tests del proyecto minecraft-framework
#
# Este workflow ejecuta los tests de pytest en push y pull_request
# usando Python 3.10 y 3.11

name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        # Instalar dependencias del proyecto (excepto mcpi que se mockea)
        pip install asyncio Pyro4
        # Nota: mcpi no se instala porque los tests usan mocks

    - name: Ejecutar tests
      run: |
        pytest tests/ -v --tb=short

    - name: Ejecutar tests con cobertura (opcional)
      if: matrix.python-version == '3.11'
      run: |
        pip install pytest-cov
        pytest tests/ --cov=minecraft_framework --cov-report=term-missing --cov-report=xml
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar herramientas de linting
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Ejecutar linting básico
      run: |
        # Verificar errores de sintaxis y problemas obvios
        flake8 minecraft_framework/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Advertencias de estilo (no bloquea el CI)
        flake8 minecraft_framework/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      continue-on-error: true

