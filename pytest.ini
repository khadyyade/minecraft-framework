[pytest]
# Configuración de pytest para minecraft-framework

# Directorio de tests
testpaths = tests

# Patrones de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configuración de asyncio
asyncio_mode = auto

# Verbosidad por defecto
addopts = -v --tb=short

# Ignorar advertencias comunes
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Marcadores personalizados
markers =
    asyncio: marca tests que usan asyncio
    slow: marca tests que tardan más de lo normal
    integration: marca tests de integración

